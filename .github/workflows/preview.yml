name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# Let provisioning/deployment finish before cleanup. Cancellation can orphan a
# database when an API request completes after its runner has been stopped.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  pull-requests: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  TURSO_ORGANIZATION: ${{ vars.TURSO_ORGANIZATION }}

jobs:
  deploy:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Old queued runs and reruns must not recreate a closed PR's database.
      - name: Check current PR state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Check configuration
        if: steps.pr.outputs.state == 'open'
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_SOURCE_DATABASE: ${{ vars.TURSO_SOURCE_DATABASE }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
        run: |
          : "${TURSO_API_TOKEN:?Set the TURSO_API_TOKEN repository secret.}"
          : "${TURSO_ORGANIZATION:?Set the TURSO_ORGANIZATION repository variable.}"
          : "${TURSO_SOURCE_DATABASE:?Set TURSO_SOURCE_DATABASE to the main Turso database name.}"
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN repository secret.}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID repository variable.}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_PROJECT_ID repository variable.}"
          : "${UPLOADTHING_TOKEN:?Set UPLOADTHING_TOKEN to the existing UploadThing app token.}"

      - name: Setup
        if: steps.pr.outputs.state == 'open'
        uses: ./tooling/github/setup

      - name: Provision PR database branch
        if: steps.pr.outputs.state == 'open'
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
          TURSO_SOURCE_DATABASE: ${{ vars.TURSO_SOURCE_DATABASE }}
        run: bash tooling/github/preview-database.sh ensure

      - name: Wait for database and apply preview migrations
        if: steps.pr.outputs.state == 'open'
        working-directory: packages/db
        run: |
          bun --eval '
            import { createClient } from "@libsql/client";
            const client = createClient({ url: process.env.DATABASE_URL, authToken: process.env.DATABASE_TOKEN });
            try {
              for (let attempt = 1; ; attempt++) {
                try { await client.execute("SELECT 1"); break; }
                catch (error) {
                  if (attempt === 6) throw error;
                  await Bun.sleep(5000);
                }
              }
            } finally { client.close(); }
          '
          bun scripts/migrate.ts

      - name: Clear inherited push registrations and enable preview uploads
        if: steps.pr.outputs.state == 'open'
        run: bun tooling/github/preview-uploads.ts open

      - name: Deploy Vercel preview
        if: steps.pr.outputs.state == 'open'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
        run: |
          # Upload from the monorepo root. Vercel's project root is apps/nextjs.
          # Remote builds retain Vercel's system URL variables for Better Auth.
          # This version supports tokens restricted to a single project.
          deployment=$(bunx vercel@59.23.2 deploy --yes --target=preview --format=json \
            --token="$VERCEL_TOKEN" \
            --build-env DATABASE_URL="$DATABASE_URL" \
            --build-env DATABASE_TOKEN="$DATABASE_TOKEN" \
            --build-env PREVIEW_PR_NUMBER="$PR_NUMBER" \
            --build-env ALLOW_SELF_MESSAGES=true \
            --build-env UPLOADTHING_TOKEN="$UPLOADTHING_TOKEN" \
            --env DATABASE_URL="$DATABASE_URL" \
            --env DATABASE_TOKEN="$DATABASE_TOKEN" \
            --env PREVIEW_PR_NUMBER="$PR_NUMBER" \
            --env ALLOW_SELF_MESSAGES=true \
            --env UPLOADTHING_TOKEN="$UPLOADTHING_TOKEN")
          # Agent sessions wrap the deployment; ordinary CI emits it directly.
          url=$(jq -er '(.deployment // .).url | strings | select(startswith("https://"))' <<< "$deployment")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url (database: whisp-pr-$PR_NUMBER)" >> "$GITHUB_STEP_SUMMARY"

  mobile:
    needs: deploy
    if: needs.deploy.outputs.url != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
    env:
      APP_VARIANT: preview
      EXPO_PUBLIC_API_URL: ${{ needs.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.7.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build or update mobile preview
        id: mobile
        working-directory: apps/expo
        run: |
          eas workflow:run .eas/workflows/preview.yml \
            --non-interactive --wait --json \
            -F "api_url=$EXPO_PUBLIC_API_URL" \
            -F "branch=pr-$PR_NUMBER" > "$RUNNER_TEMP/mobile-preview.json"

      - name: Prepare mobile preview comment
        if: ${{ !cancelled() && steps.mobile.outcome != 'skipped' }}
        run: bun tooling/github/preview-mobile.ts "$RUNNER_TEMP/mobile-preview.json" "$RUNNER_TEMP/mobile-preview.md"

      - name: Update mobile preview comment
        if: ${{ !cancelled() && steps.mobile.outcome != 'skipped' }}
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const file = path.join(process.env.RUNNER_TEMP, 'mobile-preview.md');
            if (!fs.existsSync(file)) return;
            const body = fs.readFileSync(file, 'utf8');
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, issue);
            const existing = comments.find(comment =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.startsWith('<!-- whisp-mobile-preview -->')
            );
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }

  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          # Cleanup uses trusted base-branch code, including on unmerged PRs.
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Check current PR state
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          state=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Setup
        if: steps.pr.outputs.state == 'closed'
        uses: ./tooling/github/setup

      - name: Connect to existing PR database
        if: steps.pr.outputs.state == 'closed'
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: bash tooling/github/preview-database.sh connect

      - name: Disable preview uploads and delete their files
        if: steps.pr.outputs.state == 'closed'
        id: uploads
        env:
          UPLOADTHING_TOKEN: ${{ secrets.UPLOADTHING_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bun tooling/github/preview-uploads.ts close

      - name: Delete PR database
        if: steps.uploads.outputs.closed == 'true'
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_API_TOKEN }}
        run: bash tooling/github/preview-database.sh destroy
